apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-to-cluster
  namespace: default
  labels:
    app: image-to-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-to-cluster
  template:
    metadata:
      labels:
        app: image-to-cluster
    spec:
      containers:
        - name: nginx
          image: custom-nginx:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: image-to-cluster
  namespace: default
spec:
  selector:
    app: image-to-cluster
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
